services:
  mysql:
    image: mysql:8.0
    container_name: legal-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: legal_service_consultant
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - legal_mysql_data:/var/lib/mysql

volumes:
  legal_mysql_data:
