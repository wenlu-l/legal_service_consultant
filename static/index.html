<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法硕研途 · 智能客服演示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; display: flex; justify-content: center; align-items: center;
    height: 100vh; color: #333;
  }
  .app { width: 480px; max-width: 96vw; height: 90vh; background: #fff; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }
  .header { padding: 14px 18px; background: #1e3a8a; color: #fff; display: flex; align-items: center; gap: 10px; }
  .header .avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #1e3a8a;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .header .uid { margin-left: auto; font-size: 12px; opacity: .85; }

  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1e3a8a; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #f0f2f5; color: #333; border-bottom-left-radius: 4px; }

  .card { display: inline-block; margin: 4px 0; padding: 8px 12px; background: #fff; border: 1px solid #ddd;
    border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; }
  .card:hover { border-color: #1e3a8a; box-shadow: 0 2px 8px rgba(30,58,138,.15); }
  .card .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: #eef2ff; color: #1e3a8a; margin-bottom: 4px; }
  .card .title { font-weight: 600; }
  .card .id { color: #888; font-size: 12px; }

  .toolbar { padding: 8px 16px; border-top: 1px solid #eee; display: flex; gap: 8px; }
  .toolbar .card { cursor: pointer; }

  .input-bar { display: flex; padding: 12px 16px; border-top: 1px solid #eee; gap: 8px; }
  .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #1e3a8a; }
  .input-bar button { padding: 10px 20px; border: none; background: #1e3a8a; color: #fff; border-radius: 20px;
    cursor: pointer; font-size: 14px; }
  .input-bar button:disabled { background: #b0b8cc; cursor: not-allowed; }
  .tip { padding: 6px 16px; font-size: 12px; color: #999; background: #fafafa; border-top: 1px solid #f0f0f0; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">法</div>
    <div>
      <h1>法硕研途 · 智能客服</h1>
      <div class="sub">课程咨询 · 订单查询 · 学习进度 · 退款 · 工单</div>
    </div>
    <div class="uid" id="uidLabel"></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="toolbar">
    <span class="card" onclick="sendObject('course','C001','民商法全程班')">
      <span class="tag">课程</span><div class="title">民商法全程班</div><div class="id">C001</div>
    </span>
    <span class="card" onclick="sendObject('order','A1001','法硕课程报名')">
      <span class="tag">订单</span><div class="title">法硕课程报名</div><div class="id">A1001</div>
    </span>
  </div>

  <div class="input-bar">
    <input id="input" placeholder="输入你的问题，回车发送…" />
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
  <div class="tip">提示：点上方「课程/订单」卡片可发送对象消息；后端接口为 POST /api/chat</div>
</div>

<script>
  const SENDER_ID = 'demo_user_' + Math.random().toString(36).slice(2, 8);
  document.getElementById('uidLabel').textContent = 'ID: ' + SENDER_ID;
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function addMsg(role, text, object) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (object) {
      div.innerHTML = '';
      const card = document.createElement('span');
      card.className = 'card';
      card.innerHTML = '<span class="tag">' + (object.type === 'course' ? '课程' : '订单') + '</span>' +
        '<div class="title">' + (object.title || object.id) + '</div>' +
        '<div class="id">' + object.id + '</div>';
      div.appendChild(card);
    } else if (text) {
      div.textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setLoading(v) {
    sendBtn.disabled = v;
    input.disabled = v;
  }

  async function send(text, object) {
    const t = text !== undefined ? text : input.value.trim();
    if (!t && !object) return;
    if (text === undefined) input.value = '';
    addMsg('user', t || null, object || null);
    setLoading(true);
    try {
      const body = { sender_id: SENDER_ID };
      if (object) body.object = object; else body.text = t;
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const msgs = data.messages || [];
      if (msgs.length === 0) { addMsg('bot', '（无回复）'); return; }
      msgs.forEach(m => addMsg('bot', m.text || null, m.object || null));
    } catch (e) {
      addMsg('bot', '请求失败：' + e.message + '（请确认后端已启动，端口 18085）');
    } finally {
      setLoading(false);
      input.focus();
    }
  }

  function sendObject(type, id, title) {
    send(undefined, { type, id, title, attributes: {} });
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) send(); });

  // 开场欢迎语
  addMsg('bot', '你好，我是「法硕研途」智能客服。你可以问我课程班次、查询订单、了解学习进度，或提交退款/工单。也可以点上面卡片试试对象消息。');
  input.focus();
</script>
</body>
</html>
